services:
  api:
    image: imoex-signals-python:local
    build:
      context: ../..
      dockerfile: infra/docker/python.Dockerfile
    env_file:
      - ../../.env.docker.example
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    image: imoex-signals-python:local
    build:
      context: ../..
      dockerfile: infra/docker/python.Dockerfile
    env_file:
      - ../../.env.docker.example
    command: python -m apps.worker.runner recalculate --root Si
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    image: imoex-signals-python:local
    build:
      context: ../..
      dockerfile: infra/docker/python.Dockerfile
    env_file:
      - ../../.env.docker.example
    command: python -m apps.worker.runner run-schedule-loop --iterations 1 --sleep-seconds 0
    profiles: ["scheduler"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  scheduler_daemon:
    image: imoex-signals-python:local
    build:
      context: ../..
      dockerfile: infra/docker/python.Dockerfile
    env_file:
      - ../../.env.docker.example
    command: python -m apps.worker.runner run-schedule-loop --iterations 0
    profiles: ["scheduler-daemon"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: moex_signals
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moex_signals"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:

