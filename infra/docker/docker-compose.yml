services:
  api:
    image: imoex-signals-python:local
    build:
      context: ../..
      dockerfile: infra/docker/python.Dockerfile
    env_file:
      - ../../.env.docker.example
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ui:
    image: imoex-signals-ui:local
    build:
      context: ../..
      dockerfile: infra/docker/ui.Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://api:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

  worker:
    image: imoex-signals-python:local
    build:
      context: ../..
      dockerfile: infra/docker/python.Dockerfile
    env_file:
      - ../../.env.docker.example
    command: python -m apps.worker.main
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      prefect:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: moex_signals
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moex_signals"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  prefect:
    image: prefecthq/prefect:3-python3.12
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health').read()\""]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  postgres_data:

